[project]
name = "latent-space"
version = "0.2.0"
description = "LeWM-inspired world model for the Virtual Cell Challenge 2025"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.11.0",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.10",
    "scikit-learn>=1.6",
    "anndata>=0.12",
    "scanpy>=1.12",
    "zarr>=3.0",
    "h5py>=3.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ipython>=9",
    "jupyter>=1.1",
    "umap-learn>=0.5.7",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lewm_vcc"]
